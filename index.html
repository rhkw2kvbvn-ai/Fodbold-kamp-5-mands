<head>
  <meta charset="UTF-8">

  <title>5-mands fodbold</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { background: #020617; color: #f1f5f9; font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; overscroll-behavior: none; }
    body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    input, textarea, button { font-family: inherit; }
    input:focus, textarea:focus { outline: none; }
    button { cursor: pointer; border: none; background: transparent; color: inherit; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .display { font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.02em; }
    .tabular { font-variant-numeric: tabular-nums; }

    /* Header */
    .header { position: sticky; top: 0; z-index: 20; background: rgba(2,6,23,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid #1e293b; }
    .header-inner { max-width: 800px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }
    .logo-badge { display: flex; align-items: center; gap: 12px; }
    .logo-icon { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #22c55e, #059669); display: flex; align-items: center; justify-content: center; font-weight: 900; color: white; font-size: 18px; box-shadow: 0 10px 25px -5px rgba(34,197,94,0.3); }
    .logo-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.1; color: white; }
    .logo-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #64748b; letter-spacing: 0.1em; text-transform: uppercase; }
    .header-stats { display: flex; gap: 8px; align-items: center; }
    .stat-chip { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #94a3b8; background: #0f172a; padding: 6px 10px; border-radius: 8px; border: 1px solid #1e293b; }
    .stat-chip .mono { font-weight: 500; }

    /* Tabs */
    .tabs { max-width: 800px; margin: 0 auto; padding: 0 8px; display: flex; gap: 2px; overflow-x: auto; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { padding: 10px 16px; font-size: 14px; font-weight: 500; color: #64748b; white-space: nowrap; position: relative; border-radius: 0; }
    .tab:hover { color: #cbd5e1; }
    .tab.active { color: white; }
    .tab.active::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; background: #22c55e; border-radius: 2px; }

    main { max-width: 800px; margin: 0 auto; padding: 20px 16px; }

    /* Cards */
    .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 16px; }
    .card-label { font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 10px; display: block; }
    .card-hint { font-size: 11px; color: #64748b; margin-top: 10px; line-height: 1.5; }

    /* Inputs */
    .input { width: 100%; background: #020617; border: 1px solid #1e293b; color: white; padding: 10px 14px; border-radius: 12px; font-size: 14px; transition: all 0.2s; }
    .input:focus { border-color: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,0.15); }
    .input-row { display: flex; gap: 8px; }

    /* Buttons */
    .btn { padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; transition: all 0.15s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn:active { transform: scale(0.95); }
    .btn-primary { background: linear-gradient(135deg, #22c55e, #059669); color: #020617; box-shadow: 0 10px 15px -3px rgba(34,197,94,0.2); }
    .btn-primary:hover { background: linear-gradient(135deg, #4ade80, #10b981); }
    .btn-primary:disabled { background: #1e293b; color: #475569; box-shadow: none; cursor: not-allowed; transform: none; }
    .btn-ghost { background: #020617; border: 1px solid #1e293b; color: #cbd5e1; }
    .btn-ghost:hover { color: white; border-color: #334155; }
    .btn-full { width: 100%; padding: 14px 16px; }
    .btn-danger-text { color: #64748b; border: 1px solid #0f172a; font-size: 11px; padding: 10px; font-weight: 500; background: transparent; }
    .btn-danger-text:hover { color: #f87171; border-color: #450a0a; }
    .btn-muted-text { color: #64748b; border: 1px solid #0f172a; font-size: 11px; padding: 10px; font-weight: 500; background: transparent; }
    .btn-muted-text:hover { color: #cbd5e1; }

    /* Warning banner */
    .banner { background: rgba(69,26,3,0.5); border: 1px solid #78350f; border-radius: 12px; padding: 12px; display: flex; gap: 10px; align-items: flex-start; margin-bottom: 20px; }
    .banner-icon { color: #f59e0b; flex-shrink: 0; margin-top: 2px; }
    .banner-title { font-size: 12px; font-weight: 600; color: #fde68a; margin-bottom: 4px; }
    .banner-text { font-size: 11px; color: rgba(252,211,77,0.8); line-height: 1.5; }

    /* Roster rows */
    .roster-row { border-radius: 12px; border: 1px solid #1e293b; background: #0f172a; transition: all 0.2s; }
    .roster-row:hover { border-color: #334155; }
    .roster-row.in-squad { background: rgba(34,197,94,0.08); border-color: rgba(34,197,94,0.3); }
    .roster-row-inner { display: flex; align-items: center; gap: 10px; padding: 10px; }
    .roster-toggle { flex-shrink: 0; width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #1e293b; color: #64748b; transition: all 0.15s; }
    .roster-toggle:active { transform: scale(0.9); }
    .roster-toggle:hover { background: #334155; color: #4ade80; }
    .roster-row.in-squad .roster-toggle { background: #22c55e; color: #020617; box-shadow: 0 4px 6px -1px rgba(34,197,94,0.3); }
    .roster-info { flex: 1; min-width: 0; }
    .roster-name { font-weight: 600; color: white; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .roster-stats { display: flex; gap: 12px; font-size: 10px; color: #64748b; margin-top: 2px; font-family: 'JetBrains Mono', monospace; }
    .roster-stats .goal-stat { color: #fbbf24; font-weight: 600; }
    .roster-actions { display: flex; gap: 2px; }
    .roster-btn { color: #64748b; padding: 8px; border-radius: 8px; transition: all 0.15s; }
    .roster-btn:hover { background: #1e293b; color: white; }
    .roster-btn.del:hover { color: #f87171; }

    /* Section headers */
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding: 0 4px; }
    .section-title { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; color: white; letter-spacing: -0.02em; }
    .section-meta { font-size: 11px; color: #64748b; font-family: 'JetBrains Mono', monospace; }

    /* Empty state */
    .empty { text-align: center; padding: 56px 16px; border: 1px dashed #1e293b; border-radius: 16px; }
    .empty-icon { color: #334155; margin: 0 auto 12px; }
    .empty-title { color: #94a3b8; font-weight: 500; margin-bottom: 4px; }
    .empty-text { font-size: 12px; color: #475569; margin-bottom: 16px; }

    /* Squad */
    .squad-row { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; display: flex; align-items: center; gap: 12px; padding: 10px; }
    .squad-num { width: 40px; height: 40px; border-radius: 8px; background: #020617; border: 1px solid #1e293b; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; color: #94a3b8; }

    /* Scoreboard */
    .scoreboard { background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; overflow: hidden; }
    .scoreboard-top { padding: 20px 20px 16px; display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: center; gap: 8px; }
    .team-col { text-align: center; }
    .team-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .team-label.home { color: #4ade80; }
    .team-label.away { color: #94a3b8; }
    .team-score { font-family: 'Space Grotesk', sans-serif; font-size: 72px; font-weight: 700; color: white; font-variant-numeric: tabular-nums; line-height: 1; }
    .vs { color: #475569; font-size: 12px; font-weight: 500; }

    .score-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px 16px; }
    .score-group { display: flex; gap: 6px; }
    .btn-goal-home { flex: 1; background: linear-gradient(135deg, #22c55e, #059669); color: #020617; padding: 12px; border-radius: 12px; font-weight: 600; font-size: 14px; box-shadow: 0 10px 15px -3px rgba(34,197,94,0.2); display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-goal-home:active { transform: scale(0.95); }
    .btn-goal-away { flex: 1; background: #1e293b; border: 1px solid #334155; color: white; padding: 12px; border-radius: 12px; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-goal-away:hover { background: #334155; }
    .btn-goal-away:active { transform: scale(0.95); }
    .btn-minus { padding: 12px 14px; border: 1px solid #1e293b; color: #94a3b8; border-radius: 12px; font-weight: 600; font-size: 14px; }
    .btn-minus:hover:not(:disabled) { color: white; border-color: #334155; }
    .btn-minus:disabled { opacity: 0.3; cursor: not-allowed; }

    .scorers-section { padding: 0 16px 16px; border-top: 1px solid #1e293b; padding-top: 12px; margin-top: 8px; }
    .scorers-label { font-size: 9px; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
    .scorer-chip { display: inline-flex; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); color: #fcd34d; font-size: 12px; padding: 4px 10px; border-radius: 8px; font-weight: 500; margin-right: 6px; margin-bottom: 6px; }

    /* Timer */
    .timer-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 20px; transition: all 0.3s; }
    .timer-card.running { border-color: rgba(34,197,94,0.4); box-shadow: 0 10px 15px -3px rgba(34,197,94,0.1); }
    .timer-card.zero { border-color: rgba(239,68,68,0.4); }
    .timer-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .timer-label { font-size: 10px; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; }
    .timer-status { font-size: 12px; color: #94a3b8; font-family: 'JetBrains Mono', monospace; margin-top: 2px; }
    .timer-display { text-align: center; padding: 8px 0; font-family: 'Space Grotesk', sans-serif; font-size: 80px; font-weight: 700; color: #cbd5e1; font-variant-numeric: tabular-nums; line-height: 1; }
    .timer-card.running .timer-display { color: white; }
    .timer-card.zero .timer-display { color: #f87171; }
    .progress-bar { position: relative; height: 6px; background: #1e293b; border-radius: 999px; overflow: hidden; margin: 12px 0 16px; }
    .progress-fill { position: absolute; top: 0; left: 0; bottom: 0; background: linear-gradient(90deg, #22c55e, #4ade80); border-radius: 999px; transition: width 0.3s; }
    .progress-marker { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: #020617; }
    .btn-timer { width: 100%; padding: 16px; border-radius: 16px; font-weight: 700; font-size: 16px; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-timer.start { background: linear-gradient(135deg, #22c55e, #059669); color: #020617; box-shadow: 0 10px 15px -3px rgba(34,197,94,0.25); }
    .btn-timer.pause { background: #f59e0b; color: #020617; box-shadow: 0 10px 15px -3px rgba(245,158,11,0.25); }
    .btn-timer.reset-all { background: #1e293b; border: 1px solid #334155; color: white; }
    .btn-timer:active { transform: scale(0.99); }

    .duration-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid #1e293b; }
    .duration-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .duration-warn { font-size: 10px; color: #fbbf24; }
    .duration-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .duration-btn { padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 600; background: #020617; border: 1px solid #1e293b; color: #94a3b8; }
    .duration-btn:hover:not(:disabled) { border-color: #334155; }
    .duration-btn.active { background: #22c55e; color: #020617; border-color: #22c55e; box-shadow: 0 4px 6px -1px rgba(34,197,94,0.2); }
    .duration-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Pitch */
    .pitch { position: relative; width: 100%; max-width: 500px; margin: 0 auto; aspect-ratio: 3/4; background: repeating-linear-gradient(0deg, #15803d 0px, #15803d 40px, #166534 40px, #166534 80px); border: 4px solid rgba(255,255,255,0.8); border-radius: 12px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    .pitch-markings { position: absolute; inset: 0; pointer-events: none; }
    .pitch-halfway { position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: rgba(255,255,255,0.7); }
    .pitch-center { position: absolute; left: 50%; top: 50%; width: 80px; height: 80px; border: 2px solid rgba(255,255,255,0.7); border-radius: 50%; transform: translate(-50%, -50%); }
    .pitch-center-dot { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; background: rgba(255,255,255,0.7); border-radius: 50%; transform: translate(-50%, -50%); }
    .pitch-goal-box-top { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 60%; height: 13%; border: 2px solid rgba(255,255,255,0.7); border-top: none; border-bottom-left-radius: 4px; border-bottom-right-radius: 4px; }
    .pitch-goal-top { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 16%; height: 2%; background: rgba(255,255,255,0.3); border-left: 2px solid rgba(255,255,255,0.9); border-right: 2px solid rgba(255,255,255,0.9); }
    .pitch-goal-box-bottom { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 60%; height: 13%; border: 2px solid rgba(255,255,255,0.7); border-bottom: none; border-top-left-radius: 4px; border-top-right-radius: 4px; }
    .pitch-goal-bottom { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 16%; height: 2%; background: rgba(255,255,255,0.3); border-left: 2px solid rgba(255,255,255,0.9); border-right: 2px solid rgba(255,255,255,0.9); }
    .player-btn { position: absolute; transform: translate(-50%, -50%); transition: transform 0.2s; }
    .player-btn:hover { transform: translate(-50%, -50%) scale(1.05); }
    .player-btn.selected { transform: translate(-50%, -50%) scale(1.1); }
    .player-circle { width: 56px; height: 56px; border-radius: 50%; border: 4px solid white; display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); position: relative; }
    .player-btn.selected .player-circle { box-shadow: 0 0 0 4px #fde68a, 0 0 0 6px #15803d; }
    .player-short { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700; color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
    .player-goal-badge { position: absolute; top: -4px; right: -4px; background: #fbbf24; color: #020617; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; border: 2px solid #020617; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    .player-name-label { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 6px; white-space: nowrap; background: rgba(2,6,23,0.95); color: white; font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 6px; border: 1px solid #1e293b; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
    @media (min-width: 640px) { .player-circle { width: 64px; height: 64px; } .player-short { font-size: 16px; } }

    /* Subs */
    .subs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (min-width: 640px) { .subs-grid { grid-template-columns: 1fr 1fr 1fr; } }
    .sub-card { background: #020617; border: 1px solid #1e293b; border-radius: 12px; padding: 12px; text-align: left; transition: all 0.15s; }
    .sub-card:hover { border-color: #334155; }
    .sub-card:active { transform: scale(0.95); }
    .sub-card.selected { background: #22c55e; color: #020617; border-color: #22c55e; box-shadow: 0 10px 15px -3px rgba(34,197,94,0.2); }
    .sub-card .sub-name { font-weight: 600; font-size: 14px; color: white; display: flex; align-items: center; gap: 4px; }
    .sub-card.selected .sub-name { color: #020617; }
    .sub-card .sub-meta { font-size: 10px; font-family: 'JetBrains Mono', monospace; opacity: 0.6; margin-top: 2px; color: #94a3b8; }
    .sub-card.selected .sub-meta { color: #020617; }
    .sub-goal { color: #fbbf24; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; animation: pop-in 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .modal { background: #0f172a; border: 1px solid #334155; max-width: 500px; width: 100%; padding: 20px; max-height: 85vh; overflow: auto; border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .modal-title { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; color: white; letter-spacing: -0.02em; }
    .modal-close { color: #94a3b8; padding: 4px; border-radius: 8px; }
    .modal-close:hover { color: white; background: #1e293b; }
    .modal-text { font-size: 12px; color: #94a3b8; margin-bottom: 12px; line-height: 1.5; }
    .textarea { width: 100%; height: 200px; background: #020617; border: 1px solid #1e293b; color: #cbd5e1; padding: 12px; border-radius: 12px; font-size: 11px; font-family: 'JetBrains Mono', monospace; resize: vertical; }
    .textarea:focus { border-color: #22c55e; }
    .scorer-btn { width: 100%; text-align: left; background: #1e293b; border: 1px solid #334155; color: white; padding: 12px 16px; border-radius: 12px; font-weight: 600; transition: all 0.15s; margin-bottom: 6px; }
    .scorer-btn:hover { background: #22c55e; color: #020617; border-color: #22c55e; }
    .scorer-btn:active { transform: scale(0.98); }

    /* History */
    .history-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .history-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    .history-delete { color: #475569; padding: 8px; border-radius: 8px; transition: all 0.15s; font-size: 16px; align-self: flex-start; margin-left: 4px; }
    .history-delete:hover { color: #f87171; background: rgba(239,68,68,0.1); }
    .history-delete:active { transform: scale(0.9); }
    .history-num { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700; color: white; }
    .history-date { font-size: 10px; color: #64748b; font-family: 'JetBrains Mono', monospace; }
    .history-score { font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; color: white; font-variant-numeric: tabular-nums; text-align: right; }
    .result-tag { display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 0.1em; padding: 2px 8px; border-radius: 6px; border: 1px solid; }
    .result-tag.won { background: rgba(34,197,94,0.1); border-color: rgba(34,197,94,0.3); color: #4ade80; }
    .result-tag.drew { background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.3); color: #fbbf24; }
    .result-tag.lost { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); color: #f87171; }
    .history-teams { font-size: 11px; color: #94a3b8; margin-bottom: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-positions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
    @media (min-width: 640px) { .history-positions { grid-template-columns: repeat(5, 1fr); } }
    .pos-card { background: #020617; border: 1px solid #1e293b; border-radius: 8px; padding: 8px; }
    .pos-label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 2px; }
    .pos-name { color: white; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; }

    /* Animations */
    @keyframes pop-in { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes goal-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
    @keyframes slide-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .pop-in { animation: pop-in 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .goal-pulse { animation: goal-pulse 0.5s ease-out; }
    .slide-up { animation: slide-up 0.3s ease-out; }

    footer { max-width: 800px; margin: 0 auto; padding: 16px 16px 32px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #475569; letter-spacing: 0.1em; text-transform: uppercase; }

    /* Utilities */

  </style>
</head>

<header class="header">
  <div class="header-inner">
    <div class="logo-badge">
      <div class="logo-icon">5</div>
      <div>
        <div class="logo-title">5-mands</div>

  </nav>
</header>

<main>
  <div id="viewContainer"></div>
</main>

<footer>DBU · 5:5 · HAK-princip</footer>

<div id="modalRoot"></div>

<script>
// ============================================================
// STATE & STORAGE
// ============================================================
const STORAGE_KEY = 'fodbold5mands_html_v1';

const POSITIONS = [
  { id: 'GK', label: 'Målmand', short: 'MV', x: 50, y: 88, color: '#f59e0b' },
  { id: 'DEF', label: 'Forsvar', short: 'FOR', x: 50, y: 68, color: '#3b82f6' },
  { id: 'LM', label: 'Venstre midt', short: 'VM', x: 22, y: 45, color: '#8b5cf6' },
  { id: 'RM', label: 'Højre midt', short: 'HM', x: 78, y: 45, color: '#8b5cf6' },
  { id: 'ATT', label: 'Angriber', short: 'ANG', x: 50, y: 20, color: '#ef4444' },
];

let state = {
  roster: [],
  squadIds: [],
  homeTeamName: 'Vores hold',
  awayTeamName: 'Modstander',
  matches: [],
  currentMatch: null,
  view: 'roster',
  newPlayerName: '',
  editingPlayer: null,
  editName: '',
  selectedPlayer: null,
};

let timerInterval = null;

function loadState() {
  try {
    const data = localStorage.getItem(STORAGE_KEY);
    if (data) {
      const parsed = JSON.parse(data);
      state.roster = parsed.roster || [];
      state.squadIds = parsed.squadIds || [];
      state.homeTeamName = parsed.homeTeamName || 'Vores hold';
      state.awayTeamName = parsed.awayTeamName || 'Modstander';
      state.matches = parsed.matches || [];
      state.currentMatch = parsed.currentMatch || null;
    }
  } catch (e) { console.warn('Load failed:', e); }
}

function saveState() {
  try {
    const data = {
      roster: state.roster,
      squadIds: state.squadIds,
      homeTeamName: state.homeTeamName,
      awayTeamName: state.awayTeamName,
      matches: state.matches,
      currentMatch: state.currentMatch,
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) { console.warn('Save failed:', e); }
}

function getPlayer(id) { return state.roster.find(p => p.id === id); }
function getSquadPlayers() { return state.squadIds.map(id => getPlayer(id)).filter(Boolean); }

// ============================================================
// WHISTLE SOUND
// ============================================================
function playWhistle(type) {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const now = ctx.currentTime;
    if (type === 'start') {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(2500, now);
      osc.frequency.exponentialRampToValueAtTime(2800, now + 0.1);
      osc.frequency.exponentialRampToValueAtTime(2500, now + 0.6);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.25, now + 0.03);
      gain.gain.setValueAtTime(0.25, now + 0.55);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.75);
    } else if (type === 'end') {
      for (let i = 0; i < 3; i++) {
        const start = now + i * 0.4;
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(2500, start);
        osc.frequency.exponentialRampToValueAtTime(2800, start + 0.08);
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.25, start + 0.03);
        gain.gain.setValueAtTime(0.25, start + 0.25);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
        osc.connect(gain).connect(ctx.destination);
        osc.start(start); osc.stop(start + 0.4);
      }
    } else if (type === 'half') {
      for (let i = 0; i < 2; i++) {
        const start = now + i * 0.35;
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(2500, start);
        osc.frequency.exponentialRampToValueAtTime(2800, start + 0.08);
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.25, start + 0.03);
        gain.gain.setValueAtTime(0.25, start + 0.2);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.3);
        osc.connect(gain).connect(ctx.destination);
        osc.start(start); osc.stop(start + 0.35);
      }
    }
  } catch (e) { console.warn('Whistle failed:', e); }
}

// ============================================================
// ACTIONS
// ============================================================
function addPlayer() {
  const name = state.newPlayerName.trim();
  if (!name) return;
  if (state.roster.some(p => p.name.toLowerCase() === name.toLowerCase())) return;
  state.roster.push({
    id: Date.now().toString() + Math.random().toString(36).slice(2, 6),
    name, minutesPlayed: 0, matchesPlayed: 0, goals: 0, positionHistory: {},
  });
  state.newPlayerName = '';
  saveState();
  render();
  setTimeout(() => document.getElementById('newPlayerInput')?.focus(), 0);
}

function removePlayer(id) {
  state.roster = state.roster.filter(p => p.id !== id);
  state.squadIds = state.squadIds.filter(sid => sid !== id);
  saveState(); render();
}

function startRename(id) {
  const p = getPlayer(id);
  state.editingPlayer = id;
  state.editName = p.name;
  render();
  setTimeout(() => {
    const inp = document.getElementById('renameInput');
    if (inp) { inp.focus(); inp.select(); }
  }, 0);
}

function commitRename() {
  const name = state.editName.trim();
  if (name) state.roster = state.roster.map(p => p.id === state.editingPlayer ? { ...p, name } : p);
  state.editingPlayer = null;
  state.editName = '';
  saveState(); render();
}

function cancelRename() {
  state.editingPlayer = null;
  state.editName = '';
  render();
}

function toggleSquad(id) {
  if (state.squadIds.includes(id)) state.squadIds = state.squadIds.filter(sid => sid !== id);
  else state.squadIds.push(id);
  saveState(); render();
}

function clearSquad() {
  state.squadIds = [];
  saveState(); render();
}

function generateMatch() {
  const squad = getSquadPlayers();
  if (squad.length < 5) return;
  const sorted = [...squad].sort((a, b) => {
    if (a.minutesPlayed !== b.minutesPlayed) return a.minutesPlayed - b.minutesPlayed;
    return a.matchesPlayed - b.matchesPlayed;
  });
  const starters = sorted.slice(0, 5);
  const subs = sorted.slice(5, 8);
  const assignments = {};
  const available = [...starters];
  for (const posId of ['GK', 'DEF', 'LM', 'RM', 'ATT']) {
    if (available.length === 0) break;
    let best = available[0];
    let bestCount = best.positionHistory[posId] || 0;
    for (const p of available) {
      const c = p.positionHistory[posId] || 0;
      if (c < bestCount) { best = p; bestCount = c; }
    }
    assignments[posId] = best.id;
    available.splice(available.indexOf(best), 1);
  }
  state.currentMatch = {
    id: Date.now().toString(),
    assignments, subs: subs.map(s => s.id),
    durationMinutes: 30, halfTimeMinutes: 15,
    homeScore: 0, awayScore: 0, scorers: [],
    homeTeamName: state.homeTeamName, awayTeamName: state.awayTeamName,
    createdAt: new Date().toISOString(), saved: false,
    timerSecondsRemaining: 30 * 60, timerRunning: false,
    timerLastStarted: null, halfReached: false, endReached: false,
  };
  state.view = 'match';
  saveState(); render();
}

function swapPlayers(p1, p2) {
  if (!state.currentMatch) return;
  const a = { ...state.currentMatch.assignments };
  let subs = [...state.currentMatch.subs];
  let pos1 = null, pos2 = null;
  for (const [pos, id] of Object.entries(a)) {
    if (id === p1) pos1 = pos;
    if (id === p2) pos2 = pos;
  }
  const si1 = subs.indexOf(p1), si2 = subs.indexOf(p2);
  if (pos1 && pos2) { a[pos1] = p2; a[pos2] = p1; }
  else if (pos1 && si2 >= 0) { a[pos1] = p2; subs[si2] = p1; }
  else if (si1 >= 0 && pos2) { a[pos2] = p1; subs[si1] = p2; }
  state.currentMatch.assignments = a;
  state.currentMatch.subs = subs;
  saveState(); render();
}

function setMatchDuration(mins) {
  if (!state.currentMatch || state.currentMatch.timerRunning) return;
  state.currentMatch.durationMinutes = mins;
  state.currentMatch.halfTimeMinutes = mins / 2;
  state.currentMatch.timerSecondsRemaining = mins * 60;
  state.currentMatch.halfReached = false;
  state.currentMatch.endReached = false;
  saveState(); render();
}

function addHomeGoal(playerId) {
  if (!state.currentMatch) return;
  if (playerId) state.currentMatch.scorers.push({ playerId, at: new Date().toISOString() });
  state.currentMatch.homeScore++;
  saveState(); render();
  flashScore('home');
}

function subtractHomeGoal() {
  if (!state.currentMatch || state.currentMatch.homeScore === 0) return;
  if (state.currentMatch.scorers.length > 0) state.currentMatch.scorers.pop();
  state.currentMatch.homeScore--;
  saveState(); render();
}

function addAwayGoal() {
  if (!state.currentMatch) return;
  state.currentMatch.awayScore++;
  saveState(); render();
  flashScore('away');
}

function subtractAwayGoal() {
  if (!state.currentMatch || state.currentMatch.awayScore === 0) return;
  state.currentMatch.awayScore--;
  saveState(); render();
}

function flashScore(side) {
  setTimeout(() => {
    const el = document.querySelector(`.team-score.${side}`);
    if (el) {
      el.classList.add('goal-pulse');
      setTimeout(() => el.classList.remove('goal-pulse'), 500);
    }
  }, 0);
}

function saveMatch() {
  if (!state.currentMatch) return;
  const m = state.currentMatch;
  const half = m.halfTimeMinutes, full = m.durationMinutes;
  const goalCounts = {};
  for (const s of m.scorers) goalCounts[s.playerId] = (goalCounts[s.playerId] || 0) + 1;
  state.roster = state.roster.map(p => {
    const posEntry = Object.entries(m.assignments).find(([, id]) => id === p.id);
    const goals = goalCounts[p.id] || 0;
    if (posEntry) {
      const [pos] = posEntry;
      return { ...p, minutesPlayed: p.minutesPlayed + full, matchesPlayed: p.matchesPlayed + 1, goals: (p.goals || 0) + goals, positionHistory: { ...p.positionHistory, [pos]: (p.positionHistory[pos] || 0) + 1 } };
    }
    if (m.subs.includes(p.id)) {
      return { ...p, minutesPlayed: p.minutesPlayed + half, matchesPlayed: p.matchesPlayed + 1, goals: (p.goals || 0) + goals };
    }
    return p;
  });
  state.matches.push({ ...m, saved: true, savedAt: new Date().toISOString() });
  state.currentMatch = null;
  state.view = 'squad';
  saveState(); render();
}

function cancelMatch() {
  state.currentMatch = null;
  state.view = 'squad';
  saveState(); render();
}

function deleteMatch(matchId) {
  const match = state.matches.find(m => m.id === matchId);
  if (!match) return;
  const date = new Date(match.savedAt || match.createdAt).toLocaleDateString('da-DK');
  if (!confirm(`Slet denne kamp?\n\n${match.homeTeamName} ${match.homeScore}–${match.awayScore} ${match.awayTeamName}\n${date}\n\nSpilletid, mål og positionshistorik rulles tilbage.`)) return;

  // Roll back player stats
  const half = match.halfTimeMinutes;
  const full = match.durationMinutes;
  const goalCounts = {};
  for (const s of (match.scorers || [])) goalCounts[s.playerId] = (goalCounts[s.playerId] || 0) + 1;

  state.roster = state.roster.map(p => {
    const posEntry = Object.entries(match.assignments).find(([, id]) => id === p.id);
    const goals = goalCounts[p.id] || 0;
    if (posEntry) {
      const [pos] = posEntry;
      const newPosHistory = { ...p.positionHistory };
      if (newPosHistory[pos]) {
        newPosHistory[pos] = Math.max(0, newPosHistory[pos] - 1);
        if (newPosHistory[pos] === 0) delete newPosHistory[pos];
      }
      return {
        ...p,
        minutesPlayed: Math.max(0, p.minutesPlayed - full),
        matchesPlayed: Math.max(0, p.matchesPlayed - 1),
        goals: Math.max(0, (p.goals || 0) - goals),
        positionHistory: newPosHistory,
      };
    }
    if (match.subs.includes(p.id)) {
      return {
        ...p,
        minutesPlayed: Math.max(0, p.minutesPlayed - half),
        matchesPlayed: Math.max(0, p.matchesPlayed - 1),
        goals: Math.max(0, (p.goals || 0) - goals),
      };
    }
    return p;
  });

  // Remove match
  state.matches = state.matches.filter(m => m.id !== matchId);
  saveState(); render();
}

function resetAll() {
  if (!confirm('Slet ALT (kartotek, hold og kampe)? Kan ikke fortrydes.')) return;
  state.roster = []; state.squadIds = []; state.matches = []; state.currentMatch = null;
  state.view = 'roster';
  saveState(); render();
}

function resetStats() {
  if (!confirm('Nulstil spilletid, mål og positionshistorik for alle spillere?')) return;
  state.roster = state.roster.map(p => ({ ...p, minutesPlayed: 0, matchesPlayed: 0, goals: 0, positionHistory: {} }));
  state.matches = [];
  saveState(); render();
}

// Timer actions
function handleTimerToggle() {
  const m = state.currentMatch;
  if (!m) return;
  if (m.endReached) {
    m.timerSecondsRemaining = m.durationMinutes * 60;
    m.timerRunning = false; m.timerLastStarted = null;
    m.halfReached = false; m.endReached = false;
    saveState(); render();
    return;
  }
  const actual = getActualRemaining();
  if (m.timerRunning) {
    m.timerRunning = false;
    m.timerSecondsRemaining = actual;
    m.timerLastStarted = null;
  } else {
    if (actual === m.durationMinutes * 60) playWhistle('start');
    m.timerRunning = true;
    m.timerLastStarted = new Date().toISOString();
  }
  saveState(); render();
}

function handleTimerReset() {
  const m = state.currentMatch;
  if (!m) return;
  m.timerSecondsRemaining = m.durationMinutes * 60;
  m.timerRunning = false; m.timerLastStarted = null;
  m.halfReached = false; m.endReached = false;
  saveState(); render();
}

function getActualRemaining() {
  const m = state.currentMatch;
  if (!m) return 0;
  let r = m.timerSecondsRemaining;
  if (m.timerRunning && m.timerLastStarted) {
    const elapsed = Math.floor((Date.now() - new Date(m.timerLastStarted).getTime()) / 1000);
    r = Math.max(0, m.timerSecondsRemaining - elapsed);
  }
  return r;
}

// Backup / restore
function openExportDialog() {
  const data = { roster: state.roster, squadIds: state.squadIds, homeTeamName: state.homeTeamName, awayTeamName: state.awayTeamName, matches: state.matches, exportedAt: new Date().toISOString(), version: 1 };
  showModal('export', JSON.stringify(data, null, 2));
}

function openImportDialog() {
  showModal('import', '');
}

function doImport(text) {
  try {
    const data = JSON.parse(text);
    if (!data.roster) throw new Error('Ugyldig fil (mangler roster)');
    if (!confirm(`Indlæs ${data.roster.length} spillere og ${(data.matches || []).length} kampe? Nuværende data overskrives.`)) return false;
    state.roster = data.roster || [];
    state.squadIds = data.squadIds || [];
    state.homeTeamName = data.homeTeamName || 'Vores hold';
    state.awayTeamName = data.awayTeamName || 'Modstander';
    state.matches = data.matches || [];
    saveState(); render();
    alert('Data indlæst!');
    return true;
  } catch (err) {
    alert('Kunne ikke indlæse: ' + err.message);
    return false;
  }
}

async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
    if (btn) {
      const orig = btn.innerHTML;
      btn.innerHTML = '✓ Kopieret!';
      setTimeout(() => { btn.innerHTML = orig; }, 2000);
    }
  } catch (e) {
    alert('Kunne ikke kopiere. Markér teksten manuelt og kopiér.');
  }
}

async function shareFile() {
  const data = { roster: state.roster, squadIds: state.squadIds, homeTeamName: state.homeTeamName, awayTeamName: state.awayTeamName, matches: state.matches, exportedAt: new Date().toISOString(), version: 1 };
  const json = JSON.stringify(data, null, 2);
  const filename = `fodbold-backup-${new Date().toISOString().slice(0, 10)}.json`;

  // Try Web Share API with file (works on iOS Safari - opens share sheet with "Save to Files")
  try {
    const file = new File([json], filename, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Fodbold backup' });
      return;
    }
  } catch (e) {
    if (e.name === 'AbortError') return; // User cancelled - that's fine
    console.warn('Share failed, falling back to download:', e);
  }

  // Fallback: traditional download for browsers without share API
  try {
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('Kunne ikke gemme fil. Brug "Kopiér tekst" i stedet.');
  }
}

function uploadFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    if (doImport(e.target.result)) closeModal();
  };
  reader.readAsText(file);
  event.target.value = '';
}

// Modal
function showModal(type, text) {
  const root = document.getElementById('modalRoot');
  if (type === 'export') {
    root.innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
        <div class="modal">
          <div class="modal-header">
            <div class="modal-title">Eksportér data</div>
            <button class="modal-close" onclick="closeModal()">✕</button>
          </div>
          <div class="modal-text">Gem en kopi af dine data. Vælg en metode:</div>
          <textarea class="textarea" readonly id="exportText" onclick="this.select()">${escapeHtml(text)}</textarea>
          <div class="grid-2" style="margin-top:12px;">
            <button class="btn btn-ghost" onclick="shareFile()">💾 Gem fil</button>
            <button class="btn btn-primary" onclick="copyText(document.getElementById('exportText').value, this)">📋 Kopiér tekst</button>
          </div>
          <div class="card-hint" style="margin-top:12px;">Tip: "Gem fil" åbner del-arket — vælg "Gem i Filer" for at gemme i Filer-appen, eller send via mail/AirDrop.</div>
        </div>
      </div>
    `;
  } else if (type === 'import') {
    root.innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
        <div class="modal">
          <div class="modal-header">
            <div class="modal-title">Importér data</div>
            <button class="modal-close" onclick="closeModal()">✕</button>
          </div>
          <div class="modal-text">Indsæt tidligere eksporteret data, eller vælg en fil.</div>
          <textarea class="textarea" id="importText" placeholder="Indsæt JSON-data her..."></textarea>
          <input type="file" id="fileInput" accept="application/json,.json" onchange="uploadFile(event)" style="display:none;">
          <div class="grid-2" style="margin-top:12px;">
            <button class="btn btn-ghost" onclick="document.getElementById('fileInput').click()">📁 Vælg fil</button>
            <button class="btn btn-primary" onclick="const t=document.getElementById('importText').value; if(!t.trim()){alert('Indsæt data først');return;} if(doImport(t))closeModal();">Indlæs data</button>
          </div>
        </div>
      </div>
    `;
  } else if (type === 'scorer') {
    const subs = state.currentMatch.subs;
    const onField = Object.values(state.currentMatch.assignments);
    const all = [...onField, ...subs];
    root.innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
        <div class="modal">
          <div class="modal-header">
            <div class="modal-title">Hvem scorede?</div>
            <button class="modal-close" onclick="closeModal()">✕</button>
          </div>
          <div style="margin-bottom:8px;">
            ${all.map(id => {
              const p = getPlayer(id);
              return p ? `<button class="scorer-btn" onclick="addHomeGoal('${p.id}'); closeModal()">${escapeHtml(p.name)}</button>` : '';
            }).join('')}
          </div>
          <button class="btn-muted-text" style="width:100%;border-radius:12px;" onclick="addHomeGoal(null); closeModal()">Ukendt målscorer</button>
        </div>
      </div>
    `;
  }
}

function closeModal() {
  document.getElementById('modalRoot').innerHTML = '';
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ============================================================
// RENDERING
// ============================================================
function render() {
  document.getElementById('rosterCount').textContent = state.roster.length;
  document.getElementById('matchCount').textContent = state.matches.length;
  document.getElementById('squadCount').textContent = state.squadIds.length;
  document.getElementById('matchTab').innerHTML = state.currentMatch ? 'Kamp ●' : 'Kamp';

  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.view === state.view);
  });

  const container = document.getElementById('viewContainer');
  if (state.view === 'roster') container.innerHTML = renderRoster();
  else if (state.view === 'squad') container.innerHTML = renderSquad();
  else if (state.view === 'match') container.innerHTML = renderMatch();
  else if (state.view === 'history') container.innerHTML = renderHistory();

  // Timer tick
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  if (state.currentMatch && state.currentMatch.timerRunning && state.view === 'match') {
    timerInterval = setInterval(() => {
      const m = state.currentMatch;
      if (!m) return;
      const actual = getActualRemaining();
      const totalSeconds = m.durationMinutes * 60;
      const halfSeconds = totalSeconds / 2;
      // Check milestones
      if (actual <= halfSeconds && !m.halfReached && actual > 0) {
        playWhistle('half');
        m.halfReached = true;
        saveState();
      }
      if (actual <= 0 && !m.endReached) {
        playWhistle('end');
        m.endReached = true; m.timerRunning = false;
        m.timerSecondsRemaining = 0; m.timerLastStarted = null;
        saveState();
        render();
        return;
      }
      // Just update display without full render
      const mins = Math.floor(actual / 60);
      const secs = actual % 60;
      const disp = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
      const timeEl = document.getElementById('timerDisplay');
      if (timeEl) timeEl.textContent = disp;
      const progress = 1 - (actual / totalSeconds);
      const fill = document.getElementById('progressFill');
      if (fill) fill.style.width = `${progress * 100}%`;
    }, 500);
  }
}

function renderRoster() {
  const sorted = [...state.roster].sort((a, b) => a.name.localeCompare(b.name, 'da'));
  return `
    <div class="card slide-up">
      <label class="card-label">Tilføj spiller</label>
      <div class="input-row">
        <input type="text" id="newPlayerInput" class="input" placeholder="Spillerens navn..."
          value="${escapeHtml(state.newPlayerName)}"
          oninput="state.newPlayerName=this.value"
          onkeydown="if(event.key==='Enter'){event.preventDefault();addPlayer();}">
        <button class="btn btn-primary" onclick="addPlayer()">+ Tilføj</button>
      </div>
      <div class="card-hint">Tryk på spillerne for at tilføje dem til dagens trup.</div>
    </div>

    ${state.roster.length === 0 ? `
      <div class="empty" style="margin-top:20px;">
        <div class="empty-icon" style="font-size:32px;">👥</div>
        <div class="empty-title">Tomt kartotek</div>
        <div class="empty-text">Tilføj spillere ovenfor</div>
      </div>
    ` : `
      <div style="margin-top:20px;">
        <div class="section-header">
          <div class="section-title">Kartotek</div>
          <div class="section-meta">${state.roster.length} spiller${state.roster.length === 1 ? '' : 'e'} · ${state.squadIds.length} valgt</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          ${sorted.map(p => renderRosterRow(p)).join('')}
        </div>
      </div>
    `}

    ${state.squadIds.length > 0 ? `
      <button class="btn btn-primary btn-full" style="margin-top:20px;" onclick="state.view='squad'; render();">
        Gå til trup (${state.squadIds.length}) →
      </button>
    ` : ''}

    <div class="card" style="margin-top:20px;">
      <div class="card-label">Backup</div>
      <div class="card-hint" style="margin-top:0;margin-bottom:12px;">Gem en kopi af dine data. Kan sendes som mail eller gemmes i Noter.</div>
      <div class="grid-2">
        <button class="btn btn-ghost" onclick="openExportDialog()">⬇ Eksportér</button>
        <button class="btn btn-ghost" onclick="openImportDialog()">⬆ Importér</button>
      </div>
    </div>

    ${state.roster.length > 0 ? `
      <div class="grid-2" style="margin-top:16px;">
        <button class="btn-muted-text" style="border-radius:12px;" onclick="resetStats()">Nulstil statistik</button>
        <button class="btn-danger-text" style="border-radius:12px;" onclick="resetAll()">Slet alt</button>
      </div>
    ` : ''}
  `;
}

function renderRosterRow(p) {
  const inSquad = state.squadIds.includes(p.id);
  const editing = state.editingPlayer === p.id;
  return `
    <div class="roster-row ${inSquad ? 'in-squad' : ''}">
      <div class="roster-row-inner">
        <button class="roster-toggle" onclick="toggleSquad('${p.id}')">${inSquad ? '✓' : '+'}</button>
        <div class="roster-info">
          ${editing ? `
            <div style="display:flex;gap:6px;">
              <input type="text" id="renameInput" class="input" style="padding:6px 10px;font-size:14px;"
                value="${escapeHtml(state.editName)}"
                oninput="state.editName=this.value"
                onkeydown="if(event.key==='Enter')commitRename();if(event.key==='Escape')cancelRename();">
              <button class="roster-btn" onclick="commitRename()" style="color:#4ade80;">✓</button>
              <button class="roster-btn" onclick="cancelRename()">✕</button>
            </div>
          ` : `
            <div class="roster-name">${escapeHtml(p.name)}</div>
            <div class="roster-stats">
              <span>⏱ ${p.minutesPlayed}m</span>
              <span>${p.matchesPlayed} kamp${p.matchesPlayed === 1 ? '' : 'e'}</span>
              ${(p.goals || 0) > 0 ? `<span class="goal-stat">⚽ ${p.goals}</span>` : ''}
            </div>
          `}
        </div>
        ${!editing ? `
          <div class="roster-actions">
            <button class="roster-btn" onclick="startRename('${p.id}')">✎</button>
            <button class="roster-btn del" onclick="removePlayer('${p.id}')">🗑</button>
          </div>
        ` : ''}
      </div>
    </div>
  `;
}

function renderSquad() {
  const squad = getSquadPlayers();
  const canStart = squad.length >= 5;
  const sorted = [...squad].sort((a, b) => a.minutesPlayed - b.minutesPlayed);

  return `
    <div class="card slide-up">
      <label class="card-label">Kampens hold</label>
      <div class="grid-2">
        <div>
          <div style="font-size:10px;color:#4ade80;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:6px;">Hjemmehold</div>
          <input type="text" class="input" value="${escapeHtml(state.homeTeamName)}"
            oninput="state.homeTeamName=this.value; saveState();">
        </div>
        <div>
          <div style="font-size:10px;color:#94a3b8;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:6px;">Udehold</div>
          <input type="text" class="input" value="${escapeHtml(state.awayTeamName)}"
            oninput="state.awayTeamName=this.value; saveState();">
        </div>
      </div>
    </div>

    ${squad.length === 0 ? `
      <div class="empty" style="margin-top:20px;">
        <div class="empty-icon" style="font-size:32px;">👥</div>
        <div class="empty-title">Ingen spillere valgt</div>
        <div class="empty-text">${state.roster.length === 0 ? 'Tilføj spillere til kartoteket først' : 'Vælg dagens spillere fra kartoteket'}</div>
        <button class="btn btn-ghost" onclick="state.view='roster'; render();">← Åbn kartotek</button>
      </div>
    ` : `
      <div style="margin-top:20px;">
        <div class="section-header">
          <div class="section-title">Dagens trup</div>
          <button class="btn-muted-text" style="border:none;padding:0;" onclick="clearSquad()">Ryd trup</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          ${sorted.map((p, idx) => `
            <div class="squad-row">
              <div class="squad-num">${String(idx + 1).padStart(2, '0')}</div>
              <div style="flex:1;min-width:0;">
                <div class="roster-name">${escapeHtml(p.name)}</div>
                <div class="roster-stats">
                  <span>⏱ ${p.minutesPlayed}m</span>
                  <span>${p.matchesPlayed} kamp${p.matchesPlayed === 1 ? '' : 'e'}</span>
                  ${(p.goals || 0) > 0 ? `<span class="goal-stat">⚽ ${p.goals}</span>` : ''}
                </div>
              </div>
              <button class="roster-btn del" onclick="toggleSquad('${p.id}')">−</button>
            </div>
          `).join('')}
        </div>
      </div>
    `}

    <button class="btn ${canStart ? 'btn-primary' : ''} btn-full" style="margin-top:20px; ${canStart ? '' : 'background:#0f172a;border:1px solid #1e293b;color:#475569;cursor:not-allowed;'}"
      ${canStart ? '' : 'disabled'} onclick="generateMatch()">
      🔀 ${canStart ? 'Lav kampopstilling' : `Mangler ${5 - squad.length} spiller${5 - squad.length === 1 ? '' : 'e'}`}
    </button>
  `;
}

function renderMatch() {
  const m = state.currentMatch;
  if (!m) {
    const squad = getSquadPlayers();
    return `
      <div class="empty">
        <div class="empty-icon" style="font-size:32px;">🏆</div>
        <div class="empty-title">Ingen aktiv kamp</div>
        <div class="empty-text">${squad.length >= 5 ? 'Generér en ny kampopstilling' : `Trup: ${squad.length}/5 spillere`}</div>
        ${squad.length >= 5 ? `<button class="btn btn-primary" onclick="generateMatch()">🔀 Generér opstilling</button>` : ''}
      </div>
    `;
  }

  const actual = getActualRemaining();
  const totalSeconds = m.durationMinutes * 60;
  const halfSeconds = totalSeconds / 2;

  // Check and fire milestones
  if (actual <= halfSeconds && !m.halfReached && actual > 0) {
    playWhistle('half');
    m.halfReached = true;
    saveState();
  }
  if (actual <= 0 && !m.endReached) {
    playWhistle('end');
    m.endReached = true; m.timerRunning = false;
    m.timerSecondsRemaining = 0; m.timerLastStarted = null;
    saveState();
  }

  const mins = Math.floor(actual / 60);
  const secs = actual % 60;
  const timeDisplay = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
  const progress = 1 - (actual / totalSeconds);
  const timerIsZero = actual === 0;

  const goalCounts = {};
  for (const s of m.scorers) goalCounts[s.playerId] = (goalCounts[s.playerId] || 0) + 1;

  const scorersHtml = Object.entries(goalCounts).map(([playerId, count]) => {
    const p = getPlayer(playerId);
    return p ? `<span class="scorer-chip">${escapeHtml(p.name)}${count > 1 ? ` ×${count}` : ''}</span>` : '';
  }).join('');

  return `
    <div class="scoreboard slide-up">
      <div class="scoreboard-top">
        <div class="team-col">
          <div class="team-label home">${escapeHtml(m.homeTeamName)}</div>
          <div class="team-score home display">${m.homeScore}</div>
        </div>
        <div class="team-col"><div class="vs">VS</div></div>
        <div class="team-col">
          <div class="team-label away">${escapeHtml(m.awayTeamName)}</div>
          <div class="team-score away display">${m.awayScore}</div>
        </div>
      </div>
      <div class="score-buttons">
        <div class="score-group">
          <button class="btn-goal-home" onclick="showModal('scorer')">⚽ MÅL</button>
          <button class="btn-minus" onclick="subtractHomeGoal()" ${m.homeScore === 0 ? 'disabled' : ''}>−</button>
        </div>
        <div class="score-group">
          <button class="btn-goal-away" onclick="addAwayGoal()">⚽ MÅL</button>
          <button class="btn-minus" onclick="subtractAwayGoal()" ${m.awayScore === 0 ? 'disabled' : ''}>−</button>
        </div>
      </div>
      ${m.scorers.length > 0 ? `
        <div class="scorers-section">
          <div class="scorers-label">Målscorere</div>
          <div>${scorersHtml}</div>
        </div>
      ` : ''}
    </div>

    <div class="timer-card ${m.timerRunning ? 'running' : ''} ${timerIsZero ? 'zero' : ''}" style="margin-top:16px;">
      <div class="timer-header">
        <div>
          <div class="timer-label">Kampur</div>
          <div class="timer-status">${timerIsZero ? 'Kamp slut' : m.timerRunning ? (m.halfReached ? '2. halvleg' : '1. halvleg') : 'Klar'}</div>
        </div>
        <button class="roster-btn" onclick="handleTimerReset()">↻</button>
      </div>
      <div class="timer-display" id="timerDisplay">${timeDisplay}</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:${progress * 100}%"></div>
        <div class="progress-marker"></div>
      </div>
      <button class="btn-timer ${timerIsZero ? 'reset-all' : m.timerRunning ? 'pause' : 'start'}" onclick="handleTimerToggle()">
        ${timerIsZero ? '↻ Start forfra' : m.timerRunning ? '⏸ Pause' : '🥏 Fløjt i gang'}
      </button>
      <div class="duration-section">
        <div class="duration-row">
          <div class="timer-label">Kamplængde</div>
          ${m.timerRunning ? `<div class="duration-warn">Låst mens timer kører</div>` : ''}
        </div>
        <div class="duration-grid">
          ${[7, 10, 12, 15, 20].map(min => `
            <button class="duration-btn ${m.durationMinutes === min ? 'active' : ''}" ${m.timerRunning ? 'disabled' : ''} onclick="setMatchDuration(${min})">${min}m</button>
          `).join('')}
        </div>
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;padding-top:16px;padding-bottom:8px;">
      <div>
        <div class="section-title">Opstilling</div>
        <div style="font-size:11px;color:#64748b;">Tryk på to spillere for at bytte</div>
      </div>
    </div>

    ${renderPitch()}

    <div class="card" style="margin-top:16px;">
      <div style="font-size:10px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:12px;">
        Udskiftere · ${m.subs.length}
      </div>
      ${m.subs.length === 0 ? `
        <div style="color:#475569;text-align:center;padding:8px 0;font-size:14px;">Ingen udskiftere</div>
      ` : `
        <div class="subs-grid">
          ${m.subs.map(id => {
            const p = getPlayer(id); if (!p) return '';
            const sel = state.selectedPlayer === id;
            const goals = goalCounts[id] || 0;
            return `
              <button class="sub-card ${sel ? 'selected' : ''}" onclick="handlePlayerClick('${id}')">
                <div class="sub-name">${escapeHtml(p.name)}${goals > 0 ? `<span class="sub-goal">⚽${goals > 1 ? goals : ''}</span>` : ''}</div>
                <div class="sub-meta">${p.minutesPlayed}m · spiller ½ kamp</div>
              </button>
            `;
          }).join('')}
        </div>
      `}
    </div>

    <div class="grid-2" style="margin-top:16px;">
      <button class="btn btn-ghost" onclick="cancelMatch()">Annullér</button>
      <button class="btn btn-primary" onclick="saveMatch()">✓ Gem kamp</button>
    </div>

    <button class="btn-muted-text" style="width:100%;margin-top:12px;border-radius:12px;" onclick="generateMatch()">↻ Generér ny opstilling</button>
  `;
}

function renderPitch() {
  const m = state.currentMatch;
  const goalCounts = {};
  for (const s of m.scorers) goalCounts[s.playerId] = (goalCounts[s.playerId] || 0) + 1;

  const players = POSITIONS.map(pos => {
    const playerId = m.assignments[pos.id];
    const player = playerId ? getPlayer(playerId) : null;
    if (!player) return '';
    const sel = state.selectedPlayer === playerId;
    const goals = goalCounts[playerId] || 0;
    return `
      <button class="player-btn ${sel ? 'selected' : ''} pop-in" style="left:${pos.x}%;top:${pos.y}%;" onclick="handlePlayerClick('${playerId}')">
        <div class="player-circle" style="background-color:${pos.color};">
          <span class="player-short">${pos.short}</span>
          ${goals > 0 ? `<div class="player-goal-badge">${goals}</div>` : ''}
        </div>
        <div class="player-name-label">${escapeHtml(player.name)}</div>
      </button>
    `;
  }).join('');

  return `
    <div class="pitch">
      <div class="pitch-markings">
        <div class="pitch-halfway"></div>
        <div class="pitch-center"></div>
        <div class="pitch-center-dot"></div>
        <div class="pitch-goal-box-top"></div>
        <div class="pitch-goal-top"></div>
        <div class="pitch-goal-box-bottom"></div>
        <div class="pitch-goal-bottom"></div>
      </div>
      ${players}
    </div>
  `;
}

function handlePlayerClick(playerId) {
  if (!state.selectedPlayer) state.selectedPlayer = playerId;
  else if (state.selectedPlayer === playerId) state.selectedPlayer = null;
  else { swapPlayers(state.selectedPlayer, playerId); state.selectedPlayer = null; }
  render();
}

function renderHistory() {
  if (state.matches.length === 0) {
    return `
      <div class="empty">
        <div class="empty-icon" style="font-size:32px;">🏆</div>
        <div class="empty-title">Ingen kampe endnu</div>
        <div class="empty-text">Gemte kampe vises her</div>
      </div>
    `;
  }
  const reversed = [...state.matches].reverse();
  return `
    <div class="section-title" style="padding:0 4px 12px;">Kamphistorik</div>
    ${reversed.map((match, idx) => {
      const matchNum = state.matches.length - idx;
      const date = new Date(match.savedAt || match.createdAt);
      const won = match.homeScore > match.awayScore;
      const drew = match.homeScore === match.awayScore;
      const resultClass = won ? 'won' : drew ? 'drew' : 'lost';
      const resultLabel = won ? 'SEJR' : drew ? 'UAFGJORT' : 'NEDERLAG';
      const matchGoalCounts = {};
      for (const s of (match.scorers || [])) matchGoalCounts[s.playerId] = (matchGoalCounts[s.playerId] || 0) + 1;
      return `
        <div class="history-card">
          <div class="history-header">
            <div style="flex:1;min-width:0;">
              <div class="history-num">Kamp #${matchNum}</div>
              <div class="history-date">${date.toLocaleDateString('da-DK', { day: '2-digit', month: 'short', year: 'numeric' })} · ${match.durationMinutes}m</div>
            </div>
            <div style="text-align:right;">
              <div class="history-score">${match.homeScore}–${match.awayScore}</div>
              <div class="result-tag ${resultClass}">${resultLabel}</div>
            </div>
            <button class="history-delete" onclick="deleteMatch('${match.id}')" title="Slet kamp">🗑</button>
          </div>
          <div class="history-teams">
            <span style="color:#4ade80;font-weight:500;">${escapeHtml(match.homeTeamName || 'Hjemme')}</span>
            <span style="color:#475569;margin:0 8px;">vs</span>
            <span>${escapeHtml(match.awayTeamName || 'Ude')}</span>
          </div>
          <div class="history-positions">
            ${POSITIONS.map(pos => {
              const playerId = match.assignments[pos.id];
              const player = playerId ? getPlayer(playerId) : null;
              const goals = playerId ? (matchGoalCounts[playerId] || 0) : 0;
              return `
                <div class="pos-card">
                  <div class="pos-label" style="color:${pos.color};">${pos.label}</div>
                  <div class="pos-name">${escapeHtml(player ? player.name : '—')}${goals > 0 ? `<span style="color:#fbbf24;font-size:10px;">⚽${goals > 1 ? goals : ''}</span>` : ''}</div>
                </div>
              `;
            }).join('')}
          </div>
          ${match.subs.length > 0 ? `
            <div>
              <div style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:#64748b;margin-bottom:6px;">Udskiftere</div>
              <div class="subs-list">
                ${match.subs.map(id => {
                  const p = getPlayer(id); const goals = matchGoalCounts[id] || 0;
                  return p ? `<span class="sub-chip">${escapeHtml(p.name)}${goals > 0 ? `<span style="color:#fbbf24;">⚽${goals > 1 ? goals : ''}</span>` : ''}</span>` : '';
                }).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }).join('')}
  `;
}

// ============================================================
// INIT
// ============================================================
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => { state.view = t.dataset.view; render(); });
});

loadState();
render();

// Prevent zoom on double-tap
let lastTouch = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouch <= 300) e.preventDefault();
  lastTouch = now;
}, { passive: false });
</script>

</body>
</html>
